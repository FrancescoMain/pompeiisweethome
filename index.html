<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pompeii Sweet Home — Guest House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #f5f0eb;
            overflow: hidden;
            position: relative;
            background: #1a1a1a;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=1920&q=80') center/cover no-repeat;
            filter: brightness(0.35);
            z-index: 0;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
            max-width: 600px;
        }

        .stars {
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            color: rgba(212, 175, 55, 0.8);
            margin-bottom: 1.5rem;
        }

        .stars-bottom {
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            color: rgba(212, 175, 55, 0.8);
            margin-top: 0.5rem;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 7vw, 4.2rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            line-height: 1.15;
            margin-bottom: 0.3rem;
        }

        h1 span {
            display: block;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 400;
            font-style: italic;
            color: rgba(196, 164, 120, 0.8);
            margin-bottom: 2.5rem;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(196, 164, 120, 0.6), transparent);
            margin: 0 auto 2rem;
        }

        .status {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(196, 164, 120, 0.7);
            margin-bottom: 2.5rem;
        }

        .contact {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .contact a {
            color: #f5f0eb;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.03em;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .contact a:hover {
            color: #c4a478;
        }

        .contact .icon {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(196, 164, 120, 0.5);
            margin-bottom: 0.5rem;
        }

        .bottom-ornament {
            margin-top: 3rem;
            font-size: 1.2rem;
            letter-spacing: 0.5rem;
            color: rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stars">&#9733; &#9733; &#9733; &#9733; &#9733;</div>

        <h1>
            <span>Pompeii</span>
            <span>Sweet Home</span>
        </h1>
        <div class="stars-bottom">&#9733; &#9733; &#9733; &#9733; &#9733;</div>

        <p class="tagline">Guest House</p>

        <div class="divider"></div>

        <p class="status">Sito in costruzione &mdash; Coming Soon</p>

        <p class="label">Info & Booking</p>

        <div class="contact">
            <a href="tel:+393494298547">
                <span class="icon">&#9742;</span>
                +39 349 429 8547
            </a>
            <a href="mailto:webkorsvagen@gmail.com">
                <span class="icon">&#9993;</span>
                webkorsvagen@gmail.com
            </a>
        </div>

        <div class="bottom-ornament">&#9733; &#9733; &#9733; &#9733; &#9733;</div>
    </div>
</body>
</html>
